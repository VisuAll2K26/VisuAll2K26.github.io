name: Publicar site

# Publica a pasta site/ no GitHub Pages a cada push na main que mexa nela.
# Tambem pode ser disparado a mao pela aba Actions.
#
# Endereco: https://visuall2k26.github.io/ -- o nome deste repositorio,
# VisuAll2K26.github.io, e o que da o endereco curto. Ele esta gravado no QR
# code de download (site/images/qr-baixar.svg).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
