name: Publicar site

# Publica a pasta site/ no GitHub Pages a cada push na main que mexa nela.
# Tambem pode ser disparado a mao pela aba Actions.
#
# Roda nos dois repositorios. Aqui publica o endereco antigo
# (juanduarte050508.github.io/VisuAll); na copia da organizacao (ver
# espelhar-organizacao.yml) publica o oficial, https://visuall2k26.github.io/,
# que e o do QR code de download.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
