name: Espelhar na organizacao

# Copia este repositorio INTEIRO para o da organizacao,
# VisuAll2K26/VisuAll2K26.github.io: todas as branches, tags e os modelos do
# Git LFS. Roda a cada push aqui, entao a copia de la esta sempre igual.
#
# Quem trabalha envia SO para ca (Juanduarte050508/VisuAll). La e espelho:
# qualquer coisa enviada direto para la e sobrescrita no proximo push daqui.
#
# O que roda em cada lado:
#   aqui ........ build do app, release do APK, testes, este espelho, site antigo
#   organizacao . so o pages.yml, que publica site/ em https://visuall2k26.github.io/
# Os outros workflows tem `if: github.repository == ...` pra nao rodar la.
#
# Precisa do secret ORG_MIRROR_TOKEN: um token com escrita no repositorio da
# organizacao (Contents e Workflows). O GITHUB_TOKEN daqui nao serve: ele nao
# escreve em outro repositorio. Sem o secret, este workflow so avisa e passa.
on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  workflow_dispatch:

concurrency:
  group: espelhar-organizacao
  cancel-in-progress: false

jobs:
  espelhar:
    if: github.repository == 'Juanduarte050508/VisuAll'
    runs-on: ubuntu-latest
    env:
      DESTINO: github.com/VisuAll2K26/VisuAll2K26.github.io.git
    steps:
      - name: Check token
        id: token
        env:
          TOKEN: ${{ secrets.ORG_MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Sem o secret ORG_MIRROR_TOKEN: a organizacao nao foi atualizada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          fetch-depth: 0
          # Sem isto o checkout grava o GITHUB_TOKEN DESTE repositorio como
          # cabecalho pra todo https://github.com/, e ele passa por cima do
          # token da organizacao no push: "You must have push access to
          # verify locks". Este repositorio e publico, ler nao precisa dele.
          persist-credentials: false

      # Os modelos (26 MB) ficam guardados entre execucoes: baixar todos a
      # cada push gastaria a cota mensal de LFS do repositorio, que o build do
      # app tambem usa.
      - name: List LFS objects
        if: steps.token.outputs.ok == 'true'
        run: git lfs ls-files --all --long | cut -d' ' -f1 | sort > .lfs-ids

      - uses: actions/cache@v4
        if: steps.token.outputs.ok == 'true'
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Push everything to the organization
        if: steps.token.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.ORG_MIRROR_TOKEN }}
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          # origin/HEAD e um apelido, nao uma branch: sem isto viraria uma
          # branch chamada HEAD na organizacao.
          git remote set-head origin -d
          git remote add organizacao "https://x-access-token:${TOKEN}@${DESTINO}"
          git lfs fetch --all origin
          git lfs push --all organizacao
          git push --force --prune organizacao \
            '+refs/remotes/origin/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
